[project]
name = "Ophanim-EDR"
version = "0.1.0"
description = "ML-Enhanced Endpoint Detection and Response Agent"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Tran Thai Huy", email = "thaihuy.tranit@gmail.com" }
]

dependencies = [
    # Core
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # ML
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    
    # Web/API
    "flask>=2.3.0",
    "flask-socketio>=5.3.0",
    "aiohttp>=3.9.0",
    
    # Database
    "pymongo>=4.6.0",
    
    # Windows-specific (optional)
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

server = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "motor>=3.3.0",
]

ml-extra = [
    "xgboost>=2.0.0",
    "pefile>=2023.2.7",
    "yara-python>=4.3.0",
]

[project.scripts]
edr-agent = "edr_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent/src/edr_agent", "server/src/edr_server", "shared/src/edr_shared"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
