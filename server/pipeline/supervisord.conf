[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Each worker keeps its own CWD so existing flat imports (e.g. `from normalizer import ...`)
# resolve. PYTHONPATH=/app from the Dockerfile makes botsv2_parsers visible everywhere.

[program:ingest]
command=python -u main.py
directory=/app/ingest
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stdout_events_enabled=false
priority=10

[program:graph-builder]
command=python -u main.py
directory=/app/graph-builder
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20

[program:rule-engine]
command=python -u main.py
directory=/app/rule-engine
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30

# ml-edge-scorer (BOTSv2 LightGBM, per-edge) removed from the default pipeline.
# THEIA ML scoring is the separate theia-gnn-scorer service (windowed GNN).
# The legacy per-edge scorer is still runnable via `docker compose --profile legacy`.
