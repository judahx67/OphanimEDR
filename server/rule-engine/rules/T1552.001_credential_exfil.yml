title: Credential File Read + Exfiltration
id: process_reads_sensitive_then_exfil
status: stable
description: >
    A process reads a sensitive credential file (/etc/shadow,
    /etc/passwd, SAM, NTDS) and then sends data over a socket.
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: EDR Thesis
date: 2026-04-18
tags:
    - attack.credential_access
    - attack.t1552.001
severity: high

logsource:
    category: provenance
    product: edr

detection:
    sequence:
        window: 300
        ordered: true
        steps:
            - step1_read_creds:
                subject:
                    type: PROCESS
                edge: READ
                object:
                    type: FILE
                    name|re: '(?i)(shadow|passwd|sam|ntds|\.key|id_rsa|credentials)'

            - step2_exfil:
                subject:
                    type: PROCESS
                edge:
                    - SEND
                    - WRITE
                object:
                    type: SOCKET

    condition: sequence

falsepositives:
    - System authentication services reading passwd/shadow normally
    - Backup agents reading credential stores
level: high
