title: System Log File Deletion
id: log_file_deletion
status: stable
description: >
    A process deletes files under /var/log — anti-forensics indicator.
    Maps Sigma rule 80915f59.
references:
    - https://attack.mitre.org/techniques/T1070/002/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_clear_logs.yml
author: EDR Thesis (adapted from SigmaHQ)
date: 2026-04-18
tags:
    - attack.defense_evasion
    - attack.t1070.002
severity: high

logsource:
    category: provenance
    product: edr

detection:
    selection:
        subject:
            type: PROCESS
        edge: DELETE
        object:
            type: FILE
            name|re: '(?i)/var/log/'

    condition: selection

falsepositives:
    - Log rotation daemons (logrotate)
level: high
