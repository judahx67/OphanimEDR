title: Connection to Known Malware Callback Port
id: suspicious_port_connection
status: stable
description: >
    A process connects to commonly abused ports (4444, 4000, 6789, 8531,
    2222, etc.) — known C2 and reverse shell callback ports.
    Maps Sigma rule dbfc7c98.
references:
    - https://attack.mitre.org/techniques/T1571/
author: EDR Thesis (adapted from SigmaHQ)
date: 2026-04-18
tags:
    - attack.command_and_control
    - attack.t1571
severity: high

logsource:
    category: provenance
    product: edr

detection:
    selection:
        subject:
            type: PROCESS
        edge: CONNECT
        object:
            type: SOCKET
            name|re: '(?i):(4444|4000|6789|8531|2222|50501|888|999|1337|31337|5555|9999)'

    condition: selection

falsepositives:
    - Development services on non-standard ports
level: high
