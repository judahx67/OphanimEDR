# EDR experiment stack — consolidated topology
#
#   simulator ──► rabbitmq ──► pipeline ──► neo4j ◄── api ── dashboard
#                              (ingest + graph-builder + rule-engine + ml-edge-scorer
#                               run as 4 supervisord children in one container)
#
# Usage:
#   docker compose up -d
#   docker compose --profile simulator run --rm simulator \
#       --scenario botsv2 --limit 5000 --rate 500
#
#   http://localhost:7474   neo4j browser  (neo4j / edr-thesis)
#   http://localhost:15672  rabbitmq admin (guest / guest)
#   http://localhost:8000/docs  api swagger
#   http://localhost:3000   dashboard

services:
  # ── Message bus ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 1g
    restart: unless-stopped

  # ── Provenance graph store ─────────────────────────────────
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/edr-thesis
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j-data:/data
    mem_limit: 2g
    restart: unless-stopped

  # ── Consolidated detection pipeline ────────────────────────
  # supervisord runs 4 workers inside one container:
  #   ingest · graph-builder · rule-engine · ml-edge-scorer
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      BATCH_SIZE: 200
      BATCH_TIMEOUT: 2.0
      MODELS_DIR: /app/ml-edge-scorer/models
      ML_THRESHOLD_HEADLINE: "0.9"
      ML_THRESHOLD_HONEST: "0.7"
    volumes:
      - ./ml-engine/botsv2/models:/app/ml-edge-scorer/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped

  # ── REST API (Neo4j backend) ───────────────────────────────
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
    depends_on:
      neo4j:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # ── Dashboard (nginx + React build) ────────────────────────
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    mem_limit: 256m
    restart: unless-stopped

  # ── LLM Incident Narrative Analyzer (profile: llm) ─────────
  # Requires GEMINI_API_KEY. Start: docker compose --profile llm up llm-analyzer
  llm-analyzer:
    build:
      context: .
      dockerfile: llm-analyzer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash-lite
      MAX_NARRATIVES_PER_RUN: "200"
      GEMINI_PACING_SECONDS: "2.0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 512m
    profiles:
      - llm
    restart: unless-stopped

  # ── Replay (profile: simulator) ────────────────────────────
  simulator:
    build:
      context: ./simulator
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../datasets/botsv2_labeled:/data/botsv2_labeled:ro
    profiles:
      - simulator

volumes:
  rabbitmq-data:
    driver: local
  neo4j-data:
    driver: local

networks:
  default:
    name: edr-network
