# Ophanim EDR — detection stack (DARPA TC E3 THEIA)
#
#   theia-replay ──► rabbitmq ──► pipeline ──► neo4j ◄── api ◄── dashboard
#                        │        (ingest + graph-builder + rule-engine
#                        │         as supervisord children in one container)
#                        ├──► theia-gnn-scorer      (FLASH: GraphSAGE + Word2Vec)
#                        ├──► theia-orthrus-scorer  (Orthrus: GAT detector)
#                        └──► llm-analyzer          (profile: llm)
#
# Start the stack:
#   docker compose up -d
#
#   http://localhost:3000       dashboard  (/compare = FLASH vs Orthrus)
#   http://localhost:8000/docs  api swagger
#   http://localhost:7474       neo4j browser  (neo4j / edr-thesis)
#   http://localhost:15672      rabbitmq admin (guest / guest)
#
# Optional profiles — both need data you must supply, see README.md:
#   --profile theia-sim   theia-replay, reads DARPA TC E3 THEIA from ../external/Flash-IDS
#   --profile llm         llm-analyzer, needs GEMINI_API_KEY

services:
  # ── Message bus ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 1g
    restart: unless-stopped

  # ── Provenance graph store ─────────────────────────────────
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/edr-thesis
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j-data:/data
    mem_limit: 2g
    restart: unless-stopped

  # ── Consolidated detection pipeline ────────────────────────
  # supervisord runs 3 workers inside one container:
  #   ingest · graph-builder · rule-engine (L1 signatures)
  # ML scoring for THEIA is the separate theia-gnn-scorer service (L2).
  # Offline BOTSv2/OpTC experiments live in ml-engine/, not in this stack.
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      BATCH_SIZE: 200
      BATCH_TIMEOUT: 2.0
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped

  # ── THEIA GNN windowed scorer (L2 anomaly) ─────────────────
  # FLASH GraphSAGE + Word2Vec (our v3 weights). Consumes normalized THEIA
  # edges, accumulates a sliding provenance window, runs 20-shard explain-away,
  # and writes :gnn_seed nodes to Neo4j. Replaces the per-edge BOTSv2 scorer.
  theia-gnn-scorer:
    build:
      context: ./theia-gnn-scorer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      THEIA_CODE: /app/theia
      THEIA_WEIGHTS: trained_weights/theia_ours_v3
      # full = accumulate + score the whole graph like evaluate.py (paper regime).
      # Set SCORE_MODE=window to revert to the legacy 20k sliding window.
      SCORE_MODE: full
      WINDOW_EDGES: "20000"
      MIN_EDGES: "300"
      # Demo (--limit 20000): a short interval lets the scorer re-score after the
      # slower graph-builder finishes persisting nodes, so the /compare write-back
      # catches up instead of freezing a partial result. Cheap at demo scale
      # (~13s/score). For the offline ~9.4M-edge full eval, use the eval scripts,
      # not this live service.
      SCORE_EVERY_SECS: "120"
      IDLE_SECS: "20"
      BATCH_NODES: "5000"
    volumes:
      - ./ml-engine/theia:/app/theia:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 8g
    restart: unless-stopped

  # ── Orthrus scorer (our-impl, same substrate as FLASH) ─────
  theia-orthrus-scorer:
    build:
      context: ./theia-orthrus-scorer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      THEIA_CODE: /app/theia
      ORTHRUS_WEIGHTS: trained_weights/theia_orthrus_v1
      W2V_PATH: trained_weights/theia_ours_v3/word2vec_theia_E3.model
      SCORE_MODE: full
      WINDOW_EDGES: "20000"
      MIN_EDGES: "300"
      SCORE_EVERY_SECS: "120"
      IDLE_SECS: "20"
      # Optional: override the benign-calibrated max_val_loss threshold.
      # ORTHRUS_THRESHOLD: "19.0831"
    volumes:
      - ./ml-engine/theia:/app/theia:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 8g
    restart: unless-stopped

  # ── REST API (Neo4j backend) ───────────────────────────────
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    # LLM keys (GEMINI/GROQ/OPENAI/ANTHROPIC): copy server/.env.example → server/.env.
    # env_file paths are relative to this compose file's dir (server/).
    env_file:
      - path: .env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      # Phase-B multi-LLM: cheap defaults; premium opt-in is budget-guarded.
      # OpenAI: cheap tier gpt-4o, premium tier gpt-5.5 (credits restored).
      OPENAI_MODEL: gpt-4o
      OPENAI_PREMIUM_MODEL: gpt-5.5
      ANTHROPIC_PREMIUM_MODEL: claude-opus-4-8
      # Hard in-process ceilings — the OpenAI key is uncapped, so cap usage here.
      OPENAI_CALL_BUDGET: "40"
      PREMIUM_CALL_BUDGET: "15"
    depends_on:
      neo4j:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # ── Dashboard (nginx + React build) ────────────────────────
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    mem_limit: 256m
    restart: unless-stopped

  # ── LLM Incident Narrative Analyzer (profile: llm) ─────────
  # Requires GEMINI_API_KEY. Start: docker compose --profile llm up llm-analyzer
  llm-analyzer:
    build:
      context: .
      dockerfile: llm-analyzer/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash-lite
      MAX_NARRATIVES_PER_RUN: "200"
      # Pacing conservative on purpose — we burn one Gemini call + (optional)
      # one Groq call per alert. 8s gives ~7 alerts/min, well under both
      # free-tier per-minute caps.
      GEMINI_PACING_SECONDS: "8.0"
      # Optional Groq second-opinion. Empty key → cross-ref skipped.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: llama-3.3-70b-versatile
      GROQ_PACING_SECONDS: "4.0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 512m
    profiles:
      - llm
    restart: unless-stopped

  # ── THEIA E3 replay (profile: theia-sim) ───────────────────
  # Offline dataset adapter: streams CDM18 edges from external/Flash-IDS into
  # raw_events tagged dataset=theia. Start:
  #   docker compose --profile theia-sim run --rm theia-replay \
  #       --file ta1-theia-e3-official-6r.json.8 --limit 20000 --rate 500
  theia-replay:
    build:
      context: ./theia-replay
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      THEIA_DATA_ROOT: /data/theia
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../external/Flash-IDS:/data/theia:ro
    profiles:
      - theia-sim

volumes:
  rabbitmq-data:
    driver: local
  neo4j-data:
    driver: local

networks:
  default:
    name: edr-network
