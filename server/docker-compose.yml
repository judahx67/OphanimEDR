# EDR experiment stack
#
# Provenance pipeline:
#   simulator ──► rabbitmq(raw_events) ──► ingest ──► rabbitmq(normalized_events)
#                                                                │
#                                                      ┌─────────┴──────────┐
#                                                      ▼                    ▼
#                                              graph-builder            rule-engine
#                                                      │                    │
#                                                      ▼                    ▼
#                                                   neo4j ◄─── api ──► incidents
#
# Usage:
#   # Start all persistent services
#   docker compose up -d
#
#   # Replay 5000 real DARPA THEIA E3 datums through the pipeline
#   docker compose --profile simulator run --rm simulator \
#       --scenario theia --limit 5000 --rate 500
#
#   # Inspect
#   open http://localhost:7474   (neo4j browser:  neo4j / edr-thesis)
#   open http://localhost:15672  (rabbitmq admin: guest / guest)
#   open http://localhost:8000/docs  (api swagger)

services:
  # ── Message bus ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edr-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  # ── Provenance graph store ─────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: edr-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/edr-thesis
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  # ── Event normalizer ───────────────────────────────────────
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    container_name: edr-ingest
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      # Set to "botsv2" when replaying Splunk BOTSv2 events
      SOURCE_FORMAT: ${SOURCE_FORMAT:-theia}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ── Provenance graph writer ────────────────────────────────
  graph-builder:
    build:
      context: ./graph-builder
    container_name: edr-graph-builder
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      BATCH_SIZE: 200
      BATCH_TIMEOUT: 2.0
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── Rule-based threat detection ────────────────────────────
  # Consumes normalized_events, matches attack patterns,
  # writes Incident nodes to Neo4j and publishes to incidents queue.
  rule-engine:
    build:
      context: ./rule-engine
    container_name: edr-rule-engine
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── REST API (Neo4j backend) ───────────────────────────────
  # Serves dashboard with graph stats, incidents, and subgraph queries.
  api:
    build:
      context: ./api
    container_name: edr-api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── Dashboard (nginx + React build) ──────────────────────────
  # Builds the React app and serves it via nginx on port 3000.
  # nginx proxies /api/* to the api service internally.
  dashboard:
    build:
      context: ./dashboard
    container_name: edr-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # ── ML Edge Scorer (live, streaming) ─────────────────────────
  # Consumes normalized_events in parallel with graph-builder.
  # Scores each edge with both frozen LightGBM models and writes
  # botsv2_ml_score / botsv2_ml_score_honest onto Neo4j edges.
  # Publishes high-scoring events to ml_alerts queue.
  ml-edge-scorer:
    build:
      context: .
      dockerfile: ml-edge-scorer/Dockerfile
    container_name: edr-ml-edge-scorer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      MODELS_DIR: /app/models
      ML_THRESHOLD_HEADLINE: "0.9"
      ML_THRESHOLD_HONEST: "0.7"
    volumes:
      - ./ml-engine/botsv2/models:/app/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  # ── LLM Incident Narrative Analyzer ──────────────────────────
  # Consumes ml_alerts, pulls k-hop subgraph, calls the Gemini API,
  # writes Incident nodes with LLM narrative back to Neo4j.
  # Requires GEMINI_API_KEY env var (free-tier Google AI Studio key).
  # Start with: docker compose --profile llm up llm-analyzer
  llm-analyzer:
    build:
      context: .
      dockerfile: llm-analyzer/Dockerfile
    container_name: edr-llm-analyzer
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASS: edr-thesis
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: gemini-2.5-flash-lite
      MAX_NARRATIVES_PER_RUN: "200"
      GEMINI_PACING_SECONDS: "2.0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles:
      - llm
    restart: unless-stopped

  # ── DARPA THEIA E3 replay ──────────────────────────────────
  # Full dataset (home machine):
  #   ../darpa_data/data/theia/ta1-theia-e3-official-1r.json.0  →  /data/theia.json
  # Sample dataset (work / CI):
  #   ../darpa_data/theia-sample-150k.json.gz                   →  /data/theia.json.gz
  #
  # The simulator auto-detects .gz extension and decompresses on the fly.
  # Mount whichever file exists; comment out the other.
  simulator:
    build:
      context: ./simulator
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      # Full 3.6 GB shard (home machine) — uncomment when available
      # - ../darpa_data/data/theia/ta1-theia-e3-official-1r.json.0:/data/theia.json:ro
      # Compressed 150k-line sample
      - ../archive/darpa_data/theia-sample-150k.json.gz:/data/theia.json.gz:ro
      # BOTSv2 labeled Parquet — has _raw column (for --scenario botsv2)
      - ../datasets/botsv2_labeled:/data/botsv2_labeled:ro
    profiles:
      - simulator

volumes:
  rabbitmq-data:
    driver: local
  neo4j-data:
    driver: local

networks:
  default:
    name: edr-network
