# BOTSv2 IOC Corpus
# Source: chan2git/splunk-bots BOTSv2 walkthrough
# Extracted: 2026-04-25
#
# NOTE: Draft — requires human verification before use in labeling pipeline.
# Flagged items need review:
#   - 10.0.2.101 and similar RFC1918 IPs will match huge swaths of benign internal traffic
#   - Time windows are INFERRED from scenario date ranges, not given in the walkthrough
#   - Some IOCs are indirect (e.g. USB vendor IDs) and won't map to network/host events cleanly
#
# Time windows: BOTSv2 data spans 2017-08-02 to 2017-08-25 (epoch 1501632000 to 1503705600).
# Without per-scenario timelines in the walkthrough, we use the full dataset window.
# TODO(human): tighten windows per scenario if possible.

scenarios:

  # s100 dropped from automatic labeling (insider threat email content is
  # encoded/split across SMTP frames; literal substring matching doesn't catch
  # most of it). Listed for documentation only — not used by label.py.
  - id: s100_insider_threat
    name: "Amber Turing - Insider Threat / Data Exfiltration"
    enabled: false
    time_window:
      start: 1501632000   # 2017-08-02 00:00 UTC (dataset start)
      end: 1503705600     # 2017-08-25 00:00 UTC (dataset end)
    # IP scope note: internal IP matching alone is too broad. Label only when
    # combined with other IOCs in the same row (email address, domain, file).
    ips: []               # 10.0.2.101 excluded — too noisy
    hosts:
      - amber
      - aturing-mbp
    users:
      - aturing
      - amber.turing
      - aturing@froth.ly
    domains:
      - berkbeer.com
      - www.berkbeer.com
      - yeastiebeastie.com
    emails:
      - aturing@froth.ly
      - ambersthebest@yeastiebeastie.com
      - mberk@berkbeer.com
      - hbernhard@berkbeer.com
    files:
      - Saccharomyces_cerevisiae_patent.docx
    url_paths:
      - /images/ceoberk.png

  - id: s200_webapp_attack
    name: "Brewertalk.com Web Application Attack (XSS + SQLi)"
    time_window:
      start: 1501632000
      end: 1503705600
    # Note: 45.77.65.211 and 52.42.208.228 removed — also used by s400 APT
    # and would otherwise overwhelm s400's labeling. s200 still has plenty of
    # specific IOCs (URL paths, brewertalk.com, updatexml signature, Tor UA).
    ips:
      - 172.31.4.249        # brewertalk internal IP (s200-specific)
    hosts:
      - www.brewertalk.com
      - brewertalk
    users:
      - kIagerfield          # maliciously-created account
    domains:
      - brewertalk.com
      - www.brewertalk.com
    url_paths:
      - /member.php
      - /search.php
    attack_signatures:
      - updatexml            # SQL injection signature in _raw
      - "1502408189"         # cookie value exfiltrated via XSS
      - "Tor Browser 7.0.4"  # attacker user-agent indicator

  - id: s300_ransomware
    name: "Mallory Kraeusen - Ransomware + fpsaud Malware"
    time_window:
      start: 1502928000     # 2017-08-17 00:00 UTC
      end: 1503273600       # 2017-08-21 00:00 UTC
    hosts:
      - MACLORY-AIR13
      - kutekitten
    users:
      - mkraeusen
    domains:
      - eidk.duckdns.org
      - eidk.hopto.org
    files:
      - Frothly_marketing_campaign_Q317.pptx.crypt
      - GoT.S07E02.BOTS.BOTS.BOTS.mkv.crypt
      - HR_mkraeusen.zip
    # Generic ransomware filename signature — added because the .crypt extension
    # is the strongest single indicator of ransomware activity in this dataset
    # (33k+ raw matches vs ~30 for specific filenames).
    attack_signatures:
      - ".crypt"

  - id: s400_taedonggang_apt
    name: "Taedonggang APT - Spear-phishing → C2 → Exfil"
    time_window:
      start: 1501632000
      end: 1503705600
    ips:
      - 45.77.65.211         # APT external infra (moved here from s200 since
                             # APT events are rarer — they need this IP more)
      - 52.42.208.228        # APT SSL traffic endpoint
    files:
      - invoice.zip
      - winsys32.dll
      - "나는_데이비드를_사랑한다.hwp"
    attack_signatures:
      - "912345678"          # zip password

# Cross-scenario IOCs that apply globally
global:
  # Any event whose _raw contains these should be flagged regardless of scenario
  suspicious_tools: []
  # Attacker infrastructure observed across multiple scenarios
  shared_infrastructure_ips:
    - 45.77.65.211            # s200 + s400
    - 52.42.208.228           # s200 brewertalk + s400 APT SSL

# Labeling rules (consumed by label.py)
labeling:
  # ONLY these IOC categories are used for label matching. Other categories
  # (hosts, users, emails) are kept in the YAML for documentation but are NOT
  # used for labeling because:
  #   - hosts: appear in 'host' field of every event the victim machine produces
  #     -> labels all of victim's normal traffic as malicious
  #   - users: usernames like 'aturing' or 'mkraeusen' appear in file paths,
  #     hostnames (wrk-aturing), and registry keys for normal user activity
  #     -> false-positive explosion
  #   - emails: too noisy when matched against full _raw (may appear in legit
  #     mail relay logs unrelated to the insider threat)
  match_categories:
    - ips                # external attacker infrastructure
    - domains            # attacker C2 / phishing
    - files              # specific malicious filenames
    - url_paths          # specific attack request paths
    - attack_signatures  # exfil signatures, encoded payloads
    - registry_keys      # APT persistence keys
  # Skip ambiguous patterns that are part of normal system activity
  blocklist_patterns:
    - "schtasks.exe"     # too generic — Windows uses this normally
    - "/process.php"     # too short and generic — many legitimate web apps have this
    - "software\\microsoft\\network"  # normal Windows registry path
    - "ryan kovar"       # author name, not an IOC of attack
  min_ioc_specificity: 8     # skip IOC strings shorter than 8 chars unless in ips/url_paths
  case_sensitive: false
